name: 版本核对提醒

# AI 编程工具迭代很快(Claude Code 约 1-2 天一个版本),指南放着不管
# 很快就会从"资料"变成"错误信息"。每月 1 号开一个 issue 提醒该核对了。
# 只做提醒,不自动改内容——判断"哪条重要、会不会推翻正文"需要人/AI 过一遍。
on:
  schedule:
    - cron: "0 1 1 * *" # 每月 1 号 01:00 UTC(北京时间 09:00)
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 读取上次核对日期
        id: last
        run: |
          # 从页面顶栏抓 "核对至 YYYY-MM-DD",取最早的一个作为整体基准
          DATES=$(grep -ho "核对至 [0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}" \
            topics/claude-code-guide.html \
            topics/codex-guide.html \
            topics/toolchain-changelog.html \
            | grep -o "[0-9-]\{10\}" | sort | head -1)
          if [ -z "$DATES" ]; then DATES="未知"; fi
          echo "date=$DATES" >> "$GITHUB_OUTPUT"

      - name: 开提醒 issue
        env:
          GH_TOKEN: ${{ github.token }}
          LAST_DATE: ${{ steps.last.outputs.date }}
        run: |
          TODAY=$(date +%Y-%m-%d)
          gh issue create \
            --title "🗓 工具版本核对 · $TODAY" \
            --label "maintenance" \
            --body "$(cat <<EOF
          上次核对:**$LAST_DATE** · 今天:**$TODAY**

          ## 怎么做

          在本仓库里打开 Claude Code,说一句:

          > 跑一次工具版本核对

          会触发 \`.claude/skills/refresh-toolchain/\` 里的流程,自动完成拉取官方 changelog、
          筛选有影响的变化、反查旧内容是否被推翻、回写四个位置、重跑搜索索引。

          ## 官方源(只信这两个)

          - Claude Code — https://code.claude.com/docs/en/changelog
          - Codex — https://learn.chatgpt.com/docs/changelog

          ## 重点不是"加新的",是"查旧的有没有变错"

          命令改名、默认值变更、模型换代都会让正文里原本正确的描述直接变错。
          这类问题的危害大于信息缺失,优先处理。

          ---

          核对完成后关闭本 issue。若本月确实没有值得收录的变化,也请更新一次日期标记再关闭,
          避免读者误以为内容已经很久没人维护。
          EOF
          )"
